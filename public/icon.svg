<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="spaceGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#030615;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Space background -->
  <circle cx="50" cy="50" r="50" fill="url(#spaceGradient)"/>
  
  <!-- Stars -->
  <circle cx="20" cy="25" r="1" fill="white" opacity="0.8"/>
  <circle cx="75" cy="20" r="0.8" fill="white" opacity="0.6"/>
  <circle cx="85" cy="40" r="1.2" fill="white" opacity="0.9"/>
  <circle cx="30" cy="70" r="0.8" fill="white" opacity="0.7"/>
  <circle cx="70" cy="75" r="1" fill="white" opacity="0.8"/>
  
  <!-- Planet/Moon -->
  <circle cx="50" cy="50" r="22" fill="#e5e5e5" opacity="0.9"/>
  <ellipse cx="45" cy="45" rx="8" ry="6" fill="#c0c0c0" opacity="0.5"/>
  <ellipse cx="55" cy="55" rx="5" ry="4" fill="#c0c0c0" opacity="0.5"/>
  <ellipse cx="48" cy="58" rx="4" ry="3" fill="#c0c0c0" opacity="0.5"/>
  
  <!-- Rocket -->
  <g transform="translate(65, 30) rotate(45)">
    <polygon points="5,0 8,10 5,15 2,10" fill="#ff4444"/>
    <rect x="3" y="5" width="4" height="12" fill="#ffffff"/>
    <polygon points="3,17 5,20 7,17" fill="#ffa500"/>
  </g>
</svg>
